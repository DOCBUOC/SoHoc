<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê số lần xuất hiện theo tháng / quý / năm</title>
    <link rel="stylesheet" href="https://unpkg.com/js-year-calendar@latest/dist/js-year-calendar.min.css">
    <script src="https://unpkg.com/js-year-calendar@latest/dist/js-year-calendar.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
</head>
<body>
<form onsubmit="return false;">
    <label>Từ ngày <input id="fromDate" type="date"></label>
    <label>Đến ngày <input id="toDate" type="date"></label>
    <label>Kiểu
        <select id="type">
            <option value="month" selected>Tháng</option>
            <option value="quarter">Quý</option>
            <option value="year">Năm</option>
        </select>
    </label>
    <input type="button" id="submitBtn" value="Submit">
</form>
<div id="container"></div>
<div id="calendar"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/modules/exporting.js"></script>
<script src="https://code.highcharts.com/modules/accessibility.js"></script>
<script>
    const DATE_FORMAT = 'YYYY-MM-DD';
    // Mặc định ẩn hết các con số; thêm ?disableAll=false để hiện tất cả
    const disableAll = new URLSearchParams(window.location.search).get('disableAll') !== 'false';
    let _fromDate, _toDate, _type;
    let shownNumber = null; // con số đang hiển thị trên lịch

    $(document).ready(function () {
        // Mặc định hiển thị 12 tháng gần nhất
        $('#fromDate').val(moment().subtract(11, 'months').startOf('month').format(DATE_FORMAT));
        $('#toDate').val(moment().format(DATE_FORMAT));
        $('#submitBtn').click(loadChart);
        loadChart();
    });

    function buildCategories(from, to, type) {
        const categories = [];
        const cursor = from.clone().startOf(type);
        const end = to.clone().startOf(type);
        while (!cursor.isAfter(end)) {
            if (type === 'quarter') {
                categories.push(cursor.format('YYYY') + '-Q' + cursor.quarter());
            } else {
                categories.push(cursor.format(type === 'year' ? 'YYYY' : 'YYYY-MM'));
            }
            cursor.add(1, type);
        }
        return categories;
    }

    function loadChart() {
        _fromDate = $('#fromDate').val();
        _toDate = $('#toDate').val();
        _type = $('#type').val() || 'month';
        if (!_fromDate || !_toDate || moment(_fromDate).isAfter(moment(_toDate))) {
            alert('Vui lòng chọn khoảng thời gian hợp lệ (từ ngày <= đến ngày).');
            return;
        }
        shownNumber = null;
        drawCalendar();
        const url = '/api/thong_ke_so_lan_xuat_hien_theo_thang_quy_nam?fromDate=' + _fromDate
            + '&toDate=' + _toDate + '&type=' + _type;
        $.ajax({
            url: url,
            method: 'GET',
            success: function (data) {
                const chart = {
                    title: {text: 'Số lần xuất hiện của các con số', align: 'left'},
                    subtitle: {text: _fromDate + ' → ' + _toDate, align: 'left'},
                    yAxis: {title: {text: 'Số lần xuất hiện'}},
                    xAxis: {categories: buildCategories(moment(_fromDate), moment(_toDate), _type)},
                    legend: {layout: 'vertical', align: 'right', verticalAlign: 'middle'},
                    plotOptions: {
                        series: {
                            events: {
                                // show/hide chạy SAU khi trạng thái đã đổi nên không bị đảo
                                show: function () {
                                    if (disableAll) {
                                        shownNumber = this.name;
                                        drawCalendar(this.name);
                                    }
                                },
                                hide: function () {
                                    if (disableAll && shownNumber === this.name) {
                                        shownNumber = null;
                                        drawCalendar();
                                    }
                                }
                            }
                        }
                    },
                    series: data,
                    responsive: {
                        rules: [{
                            condition: {maxWidth: 2000},
                            chartOptions: {legend: {layout: 'horizontal', align: 'center', verticalAlign: 'bottom'}}
                        }]
                    }
                };
                if (disableAll) {
                    chart.chart = {
                        events: {
                            load: function () {
                                this.series.forEach(function (series) {
                                    series.setVisible(false, false);
                                });
                            }
                        }
                    };
                }
                Highcharts.chart('container', chart);
            },
            error: function (err) {
                console.error('Error:', err);
            }
        });
    }

    let calendar = null;

    // Vẽ lịch cho khoảng from-to; nếu có formatted_number thì tô đỏ các ngày con số đó xuất hiện
    function drawCalendar(formatted_number) {
        if (!calendar) {
            calendar = new Calendar('#calendar', {style: 'background', dataSource: []});
        }
        calendar.setMinDate(moment(_fromDate).toDate());
        calendar.setMaxDate(moment(_toDate).toDate());
        if (!formatted_number) {
            calendar.setDataSource([]);
            calendar.setYear(moment(_toDate).year());
            return;
        }
        fetch('/api/thong_ke_so_lan_xuat_hien_theo_thang_quy_nam?fromDate=' + _fromDate
            + '&toDate=' + _toDate + '&type=' + _type + '&formatted_number=' + formatted_number)
            .then(result => result.json())
            .then(rows => {
                const days = [...new Set(rows)]; // một con có thể ra nhiều lần trong ngày
                calendar.setDataSource(days.map(dateString => {
                    const date = moment(dateString, DATE_FORMAT).toDate();
                    return {startDate: date, endDate: date, color: 'red'};
                }));
                // Lịch chỉ hiện 1 năm: nhảy tới năm xuất hiện gần nhất
                const last = days[days.length - 1];
                calendar.setYear(last ? moment(last, DATE_FORMAT).year() : moment(_toDate).year());
            });
    }
</script>
</body>
</html>
